name: Checkov Action
on:
  workflow_call:
    inputs:
      path:
        description: "Path to the Terraform code"
        required: true
        type: string
permissions:
  contents: read

jobs:
  checkov:
    name: Run Checkov for Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov
      - name: Run Checkov on Terraform files
        # Excepciones documentadas (entorno académico AWS Learner Lab):
        # - CKV_TF_1: el curso usa pin por tag SemVer (?ref=vX.Y.Z), no commit hash
        run: >-
          checkov -d ${{ inputs.path }}
          --skip-check CKV_TF_1
